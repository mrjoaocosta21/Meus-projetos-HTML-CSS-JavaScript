<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <h1>Color Palette Generator</h1>
      <p>Create, lock, and copy beautiful random color palettes.</p>
    </header>

    <section class="palette" id="palette">
      <!-- Colors will be generated here -->
    </section>

    <button class="generate-btn" id="generateBtn">
      Generate Palette
    </button>

    <p class="hint">
      Click 🔒 to lock a color before generating a new palette.
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
