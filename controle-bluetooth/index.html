<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle Bluetooth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="remote">
      <header class="remote__header">
        <p class="remote__eyebrow">Controle Bluetooth</p>
        <h1 class="remote__brand">REMOTE</h1>
      </header>

      <section class="link">
        <div class="radar" id="radar" aria-hidden="true">
          <span class="radar__ring"></span>
          <span class="radar__ring"></span>
          <span class="radar__dot"></span>
        </div>
        <p class="link__status" id="status" role="status" aria-live="polite">
          Não conectado
        </p>
        <button id="connectBtn" class="btn btn--connect" type="button">
          Conectar dispositivo
        </button>
      </section>

      <section class="dpad" id="dpad" aria-label="Direcionais">
        <button class="dpad__btn" data-cmd="up" disabled aria-label="Para cima">
          <svg viewBox="0 0 24 24"><path d="M12 5l7 7M12 5l-7 7M12 5v14" /></svg>
        </button>
        <div class="dpad__row">
          <button class="dpad__btn" data-cmd="left" disabled aria-label="Esquerda">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7M12 5l-7 7" /></svg>
          </button>
          <button class="dpad__btn dpad__btn--ok" data-cmd="ok" disabled aria-label="Confirmar">
            OK
          </button>
          <button class="dpad__btn" data-cmd="right" disabled aria-label="Direita">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
          </button>
        </div>
        <button class="dpad__btn" data-cmd="down" disabled aria-label="Para baixo">
          <svg viewBox="0 0 24 24"><path d="M12 19l7-7M12 19l-7-7M12 19V5" /></svg>
        </button>
      </section>

      <section class="actions" aria-label="Ações">
        <button class="btn btn--play" data-cmd="play" disabled aria-label="Play">
          <svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7V5z" /></svg>
        </button>
        <button class="btn btn--stop" data-cmd="stop" disabled aria-label="Parar">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
        </button>
        <button class="btn btn--vol" data-cmd="volup" disabled aria-label="Aumentar volume">
          <svg viewBox="0 0 24 24">
            <path d="M3 10v4h4l5 5V5L7 10H3z" />
            <path d="M16 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
        <button class="btn btn--vol" data-cmd="voldown" disabled aria-label="Diminuir volume">
          <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z" /></svg>
        </button>
      </section>

      <p class="feedback" id="feedback" role="status" aria-live="polite">&nbsp;</p>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
