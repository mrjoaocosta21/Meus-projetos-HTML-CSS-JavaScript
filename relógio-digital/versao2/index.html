<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Relógio digital com suporte a múltiplos fusos horários, formato 12h/24h e tema claro/escuro.">
    <title>Relógio Digital</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="clock-card">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
            <span id="theme-icon">🌙</span>
        </button>

        <div class="clock">
            <span id="time">00:00:00</span>
            <span id="ampm">AM</span>
        </div>

        <p id="date" class="date">carregando data...</p>

        <div class="controls">
            <button id="format-toggle" class="pill-btn" type="button">
                Formato: <strong id="format-label">12h</strong>
            </button>

            <label class="timezone-label" for="timezone-select">
                Fuso horário
                <select id="timezone-select"></select>
            </label>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
